<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Chronicare</title>
    <script type="text/javascript">
      // SPA redirect handler with base path support
      (function(l) {
        var basePath = '/chronicareCLient/';
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          if (decoded.startsWith(basePath)) {
            decoded = decoded.substring(basePath.length);
          }
          var newPath = basePath + decoded;
          window.history.replaceState(null, null, newPath + l.hash);
        }
      }(window.location));
    </script>
  </head>
  <body>
  </body>
</html>
