<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Chronicare</title>
    <script type="text/javascript">
      // GitHub Pages SPA Redirect Handler for Base Path
      // This script redirects direct route access to query string format
      (function(l) {
        var basePath = '/chronicareCLient/';
        
        // Check if we're on a direct route access (not already redirected)
        if (l.search[1] !== '/') {
          // Extract the path after the base path
          var pathAfterBase = l.pathname.substring(basePath.length);
          
          // If there's a path after the base, redirect to query string format
          if (pathAfterBase && pathAfterBase !== '') {
            // Encode special characters for query string
            var encodedPath = pathAfterBase.replace(/&/g, '~and~');
            
            // Redirect to index.html with query string
            l.replace(
              l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
              basePath + '?/' + encodedPath +
              (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
              l.hash
            );
          }
        }
      }(window.location));
    </script>
  </head>
  <body>
  </body>
</html>
